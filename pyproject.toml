[tool.poetry]
name = "marketatlas"
version = "0.1.0"
description = "Market analysis engine — explainable market knowledge platform"
authors = ["Scott"]
readme = "MINIMAL-VIABLE.md"
packages = [{include = "marketatlas", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
polars = "^1.0"
pyarrow = ">=17.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
mypy = "^1.10"
ruff = "^0.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
